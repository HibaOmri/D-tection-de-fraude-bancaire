<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banque Populaire - Connexion Analyste Risque</title>
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon-box center-logo lg-logo">
                    <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 50 10 C 27.9 10 10 27.9 10 50 C 10 72.1 27.9 90 50 90 C 72.1 90 90 72.1 90 50 C 90 27.9 72.1 10 50 10 Z" fill="#EB680B"/>
                        <path d="M 44 26 C 54 26 66 32 70 42 C 74 52 68 64 60 72 C 53 79 40 83 30 81 C 28 76 32 71 38 69 C 46 67 56 59 54 49 C 52 41 43 38 36 40 C 30 42 26 47 24 53 C 22 48 23 41 28 35 C 33 29 38 26 44 26 Z" fill="#FFFFFF"/>
                        <circle cx="60" cy="46" r="5" fill="#FFFFFF"/>
                    </svg>
                </div>
                <h1 class="login-title">Banque Populaire</h1>
                <p class="login-subtitle">Portail Analyste Risque & Prévention des Fraudes (BP RiskGuard)</p>
            </div>

            {% if error %}
            <div class="login-error-banner">
                {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="POST" class="login-form">
                <div class="field-group">
                    <label for="username">Identifiant Analyste Risque</label>
                    <input type="text" id="username" name="username" placeholder="ex: analyste_risque" required>
                </div>

                <div class="field-group">
                    <label for="password">Mot de Passe</label>
                    <input type="password" id="password" name="password" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn btn-indigo full-width">Connexion au Tableau de Bord</button>
            </form>
        </div>
    </div>
</body>
</html>
